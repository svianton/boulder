<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Разметка трасс</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #f4f3ef;
  --surface: #ffffff;
  --text: #141414;
  --muted: #8a877f;
  --line: rgba(20, 20, 20, .1);
  --inv: #141414;
  --inv-text: #ffffff;
  --start: #22c55e;
  --top: #facc15;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0e0e; --surface: #1a1a1a; --text: #f2f2f2; --muted: #8d8d8d;
    --line: rgba(255, 255, 255, .1); --inv: #f2f2f2; --inv-text: #111; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0e0e; --surface: #1a1a1a; --text: #f2f2f2; --muted: #8d8d8d;
  --line: rgba(255, 255, 255, .1); --inv: #f2f2f2; --inv-text: #111; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 500 15px/1.4 Manrope, system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased; overscroll-behavior: none;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
button:disabled { opacity: .35; cursor: default; }
.screen { display: none; min-height: 100%; flex-direction: column; }
.screen.on { display: flex; }

/* ---- старт ---- */
#s-start { justify-content: center; align-items: center; padding: 24px 16px; gap: 28px; text-align: center; }
.logo { width: 88px; height: 88px; }
#s-start h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
#s-start p { margin: 6px 0 0; color: var(--muted); }

.btn {
  height: 52px; padding: 0 22px; border-radius: 16px; display: inline-flex; align-items: center;
  justify-content: center; gap: 8px; font-weight: 800; font-size: 16px; transition: transform .1s;
}
.btn:active:not(:disabled) { transform: scale(.97); }
.btn-main { background: var(--inv); color: var(--inv-text); }
.btn-soft { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.btn-wide { width: 100%; }

/* ---- редактор ---- */
#s-edit { height: 100%; }
.topbar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
.topbar .grow { flex: 1; font-weight: 800; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; }
.icon-btn.on { background: var(--inv); color: var(--inv-text); }
.icon-btn svg { width: 22px; height: 22px; }
.counter { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--muted); padding: 0 6px; }

.stage { flex: 1; overflow: hidden; position: relative; background: #000; touch-action: none; }
.stage-inner { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.stage canvas { display: block; width: 100%; height: 100%; }
.busy { position: absolute; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.25); }
.busy.on { display: grid; }
.spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.3); border-top-color: #fff; animation: r .7s linear infinite; }
@keyframes r { to { transform: rotate(360deg); } }

.dock { padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); display: grid; gap: 10px; background: var(--bg); }
.tools { display: grid; grid-template-columns: 1fr 1fr 1fr; background: var(--surface); border-radius: 14px; padding: 4px; gap: 4px; box-shadow: inset 0 0 0 1px var(--line); }
.tool { height: 40px; border-radius: 10px; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 7px; color: var(--muted); }
.tool i { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
.tool[data-t="start"] i { background: var(--start); }
.tool[data-t="top"] i { background: var(--top); }
.tool[data-t="hold"] i { background: transparent; box-shadow: inset 0 0 0 2px currentColor; }
.tool.on { background: var(--inv); color: var(--inv-text); }
.row { display: flex; gap: 10px; }
.row .btn { flex: 1; }
.hint { text-align: center; color: var(--muted); font-size: 13px; min-height: 18px; }

/* ---- карточка трассы (шторка) ---- */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-end; z-index: 10; }
.sheet-bg.on { display: flex; }
.sheet { width: 100%; max-width: 560px; margin: 0 auto; background: var(--bg); border-radius: 22px 22px 0 0; padding: 10px 16px calc(16px + env(safe-area-inset-bottom)); animation: up .22s ease-out; max-height: 90vh; overflow: auto; }
@keyframes up { from { transform: translateY(40%); opacity: 0; } }
.grab { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 14px; }
.label { font-size: 13px; font-weight: 800; color: var(--muted); margin: 0 0 8px; }
.grades { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 18px; }
.grade { height: 42px; border-radius: 11px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-weight: 800; }
.grade.on { background: var(--inv); color: var(--inv-text); box-shadow: none; }
.colors { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
.sw { width: 38px; height: 38px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.sw.on { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--text); }
.input { width: 100%; height: 46px; border-radius: 12px; border: 0; padding: 0 14px; background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); font: inherit; outline: none; margin-bottom: 18px; }
.input:focus { box-shadow: inset 0 0 0 2px var(--text); }

/* ---- результат ---- */
#s-done { padding: 12px 12px calc(14px + env(safe-area-inset-bottom)); gap: 12px; }
#s-done img { width: 100%; border-radius: 14px; display: block; max-height: 68vh; object-fit: contain; background: #000; }
.viewer { position: fixed; inset: 0; z-index: 15; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); color: #fff; text-align: center; }
.viewer.on { display: flex; }
.viewer img { max-width: 100%; max-height: 72vh; border-radius: 12px; -webkit-touch-callout: default; user-select: auto; }
.viewer p { margin: 0; font-weight: 700; font-size: 15px; }
.viewer .btn { width: 100%; max-width: 360px; background: #fff; color: #111; }
.toast { position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top)); transform: translateX(-50%); background: var(--inv); color: var(--inv-text); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; max-width: 90vw; text-align: center; }
.toast.on { opacity: 1; }
</style>
</head>
<body>

<!-- 1. Старт -->
<section class="screen on" id="s-start">
  <svg class="logo" viewBox="0 0 640 640" aria-hidden="true">
    <rect width="640" height="640" rx="150" fill="#141414"/>
    <path transform="translate(20 -18.75)" d="M150 380 C 200 270, 270 270, 300 340 S 400 410, 450 290" fill="none" stroke="#ff6a2b" stroke-width="78" stroke-linecap="round"/>
  </svg>
  <div>
    <h1>Разметка трасс</h1>
    <p>Фото → зацепки → категория → в чат</p>
  </div>
  <button class="btn btn-main btn-wide" style="max-width:320px" id="pick">Выбрать фото</button>
  <input type="file" accept="image/*" id="file" hidden>
</section>

<!-- 2. Разметка -->
<section class="screen" id="s-edit">
  <div class="topbar">
    <button class="icon-btn" id="close" aria-label="Закрыть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="grow"><span class="counter" id="count">0</span></div>
    <button class="icon-btn" id="undo" aria-label="Отменить" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
  </div>
  <div class="stage" id="stage">
    <div class="stage-inner" id="inner"><canvas id="view"></canvas><div class="busy" id="busy"><div class="spin"></div></div></div>
  </div>
  <div class="dock">
    <div class="hint" id="hint">Тапните по зацепке</div>
    <div class="tools">
      <button class="tool on" data-t="hold"><i></i>Зацепка</button>
      <button class="tool" data-t="start"><i></i>Старт</button>
      <button class="tool" data-t="top"><i></i>Топ</button>
    </div>
    <div class="row">
      <button class="btn btn-soft" id="similar" disabled>Найти такие же</button>
      <button class="btn btn-main" id="next" disabled>Дальше</button>
    </div>
  </div>
</section>

<!-- 3. Результат -->
<section class="screen" id="s-done">
  <img id="out" alt="Готовая трасса">
  <button class="btn btn-main btn-wide" id="send">Отправить в чат</button>
  <div class="row">
    <button class="btn btn-soft" id="again">Ещё трасса</button>
    <button class="btn btn-soft" id="newphoto">Новое фото</button>
  </div>
</section>

<!-- Шторка с параметрами -->
<div class="sheet-bg" id="sheet-bg">
  <div class="sheet">
    <div class="grab"></div>
    <div class="label">Категория</div>
    <div class="grades" id="grades"></div>
    <div class="label">Цвет</div>
    <div class="colors" id="colors"></div>
    <div class="label">Сектор или название</div>
    <input class="input" id="title" maxlength="40" placeholder="Необязательно" autocomplete="off">
    <button class="btn btn-main btn-wide" id="make">Готово</button>
  </div>
</div>

<div class="viewer" id="viewer">
  <img id="viewer-img" alt="Готовая трасса">
  <p>Зажмите фото → «Сохранить» или «Переслать»</p>
  <button class="btn btn-soft">Закрыть</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= НАСТРОЙКИ ================= */
const CONFIG = {
  gym: '',                 // название скалодрома — печатается мелко на картинке (можно оставить пустым)
  api: '',                 // не нужно: оставьте пустым (адрес своего сервера, если когда-нибудь появится)
  grades: ['4', '5a', '5b', '5c', '6a', '6a+', '6b', '6b+', '6c', '6c+', '7a', '7a+', '7b', '7b+', '7c'],
  colors: [
    ['Красная', '#e53935'], ['Оранжевая', '#fb8c00'], ['Жёлтая', '#fdd835'], ['Зелёная', '#43a047'],
    ['Голубая', '#29b6f6'], ['Синяя', '#1e40af'], ['Фиолетовая', '#8e24aa'], ['Розовая', '#ec407a'],
    ['Чёрная', '#1f1f1f'], ['Белая', '#f5f5f5'], ['Серая', '#9e9e9e'], ['Коричневая', '#6d4c41'],
  ],
};

/* ================= Telegram ================= */
const tg = window.Telegram && window.Telegram.WebApp;
const inTg = !!(tg && tg.initData);
if (tg) { try { tg.ready(); tg.expand(); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {} }
function theme() {
  if (inTg) document.documentElement.dataset.theme = tg.colorScheme;
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  try { tg && tg.setHeaderColor && tg.setHeaderColor(bg); tg && tg.setBackgroundColor && tg.setBackgroundColor(bg); } catch (e) {}
}
theme(); if (tg && tg.onEvent) tg.onEvent('themeChanged', theme);
const haptic = (t) => { try { t === 'ok' ? tg.HapticFeedback.notificationOccurred('success') : tg.HapticFeedback.impactOccurred('light'); } catch (e) {} };

const $ = (id) => document.getElementById(id);
function show(id) { document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('on', s.id === id)); }
let toastT;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }

/* ================= Цвет ================= */
// Работаем в HSV: оттенок почти не зависит от освещения, а насыщенность отличает зацепку от серой стены.
const ACH = 14; // ниже этой насыщенности — чёрная / белая / серая зацепка
function rgb2hsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d) { if (mx === r) h = ((g - b) / d) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4; }
  return [(h * 60 + 360) % 360, mx ? (d / mx) * 100 : 0, mx * 100];
}
function dist(h, s, v, ref) {
  if (ref[1] < ACH) return Math.hypot((v - ref[2]) * 0.7, Math.max(s - ref[1], 0));
  const dh = Math.abs((((h - ref[0] + 180) % 360) + 360) % 360 - 180);
  const ds = Math.max(ref[1] * 0.65 - s, 0) + Math.max(s - ref[1] * 1.8, 0) * 0.3;
  return Math.hypot(dh * 0.75, ds * 0.9, (v - ref[2]) * 0.08);
}
function hex(h, s, v) {
  s /= 100; v /= 100;
  const f = (n) => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
  return '#' + [f(5), f(3), f(1)].map((x) => Math.round(x * 255).toString(16).padStart(2, '0')).join('');
}
function nearestColor(ref) {
  let best = CONFIG.colors[0], bd = Infinity;
  for (const c of CONFIG.colors) {
    const n = parseInt(c[1].slice(1), 16);
    const [h, s, v] = rgb2hsv(n >> 16, (n >> 8) & 255, n & 255);
    let d;
    if (ref[1] >= 22) { if (s < 22) continue; d = Math.abs((((ref[0] - h + 180) % 360) + 360) % 360 - 180) + Math.abs(ref[1] - s) * 0.4 + Math.abs(ref[2] - v) * 0.15; }
    else { if (s >= 22) continue; d = Math.abs(ref[2] - v); }
    if (d < bd) { bd = d; best = c; }
  }
  return best;
}

/* ================= Состояние ================= */
const A = { w: 0, h: 0, H: null, S: null, V: null }; // анализ на уменьшенной копии
let img = null;            // исходное фото (HTMLImageElement)
let holds = [];            // {poly:[[x,y]..] норм., cx, cy, r, type:'hold'|'start'|'top'}
let history = [];
let tool = 'hold';
let refColor = null;       // цвет первой зацепки — для «найти такие же»
const meta = { grade: '', color: null, title: '' };

/* ================= Загрузка фото ================= */
$('pick').onclick = () => $('file').click();
$('newphoto').onclick = () => $('file').click();
$('file').onchange = (e) => { const f = e.target.files[0]; if (f) load(f); e.target.value = ''; };

function load(file) {
  const url = URL.createObjectURL(file);
  const im = new Image();
  im.onload = () => {
    img = im;
    const k = Math.min(1, 900 / Math.max(im.naturalWidth, im.naturalHeight));
    A.w = Math.round(im.naturalWidth * k); A.h = Math.round(im.naturalHeight * k);
    const c = document.createElement('canvas'); c.width = A.w; c.height = A.h;
    const cx = c.getContext('2d', { willReadFrequently: true });
    cx.drawImage(im, 0, 0, A.w, A.h);
    analyse(cx.getImageData(0, 0, A.w, A.h).data);
    resetRoute(true);
    show('s-edit');
    layout();
  };
  im.onerror = () => toast('Не получилось открыть фото');
  im.src = url;
}

function analyse(d) {
  const n = A.w * A.h;
  // баланс белого по светлым малонасыщенным пикселям (стена)
  let sr = 0, sg = 0, sb = 0, cnt = 0;
  for (let i = 0; i < n; i += 7) {
    const r = d[i * 4], g = d[i * 4 + 1], b = d[i * 4 + 2];
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    if (mx > 90 && mx - mn < 40) { sr += r; sg += g; sb += b; cnt++; }
  }
  let kr = 1, kg = 1, kb = 1;
  if (cnt > 50) { const m = (sr + sg + sb) / 3; kr = m / sr; kg = m / sg; kb = m / sb; }
  A.H = new Float32Array(n); A.S = new Float32Array(n); A.V = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const [h, s, v] = rgb2hsv(Math.min(255, d[i * 4] * kr), Math.min(255, d[i * 4 + 1] * kg), Math.min(255, d[i * 4 + 2] * kb));
    A.H[i] = h; A.S[i] = s; A.V[i] = v;
  }
}

/* ================= Поиск зацепки ================= */
function colorAt(x, y) {
  const px = [];
  for (let dy = -5; dy <= 5; dy++) for (let dx = -5; dx <= 5; dx++) {
    const X = x + dx, Y = y + dy;
    if (X >= 0 && Y >= 0 && X < A.w && Y < A.h) px.push(Y * A.w + X);
  }
  const sats = px.map((i) => A.S[i]).sort((a, b) => a - b);
  const thr = sats[Math.floor(sats.length * 0.4)];
  const keep = px.filter((i) => A.S[i] >= thr);
  let sx = 0, sy = 0;
  for (const i of keep) { const a = A.H[i] * Math.PI / 180, w = A.S[i] + 0.01; sx += Math.cos(a) * w; sy += Math.sin(a) * w; }
  const med = (arr) => { const s = arr.slice().sort((a, b) => a - b); return s[Math.floor(s.length / 2)]; };
  return [(Math.atan2(sy, sx) * 180 / Math.PI + 360) % 360, med(keep.map((i) => A.S[i])), med(keep.map((i) => A.V[i]))];
}

const TOL = 13;
function grow(x0, y0, ref) {
  const n = A.w * A.h, maxArea = n * 0.03;
  const seen = new Uint8Array(n);
  const stack = [y0 * A.w + x0]; seen[stack[0]] = 1;
  const pts = [];
  while (stack.length) {
    const i = stack.pop();
    pts.push(i);
    if (pts.length > maxArea) return null;
    const x = i % A.w, y = (i / A.w) | 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const X = x + dx, Y = y + dy;
      if (X < 0 || Y < 0 || X >= A.w || Y >= A.h) continue;
      const j = Y * A.w + X;
      if (seen[j]) continue; seen[j] = 1;
      if (dist(A.H[j], A.S[j], A.V[j], ref) < TOL) stack.push(j);
    }
  }
  return pts.length >= 25 ? pts : null;
}

function hull(idx) {
  // выпуклая оболочка по граничным точкам региона + небольшой отступ
  const P = idx.map((i) => [i % A.w, (i / A.w) | 0]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const p of P) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (let i = P.length - 1; i >= 0; i--) { const p = P[i]; while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  const H = lo.slice(0, -1).concat(up.slice(0, -1));
  let cx = 0, cy = 0; for (const [x, y] of P) { cx += x; cy += y; } cx /= P.length; cy /= P.length;
  const pad = Math.max(2, Math.min(A.w, A.h) * 0.004);
  const poly = H.map(([x, y]) => { const dx = x - cx, dy = y - cy, l = Math.hypot(dx, dy) || 1; return [(x + dx / l * pad) / A.w, (y + dy / l * pad) / A.h]; });
  const r = Math.sqrt(P.length / Math.PI) / A.w;
  return { poly, cx: cx / A.w, cy: cy / A.h, r };
}

function circleHold(nx, ny) {
  const R = 0.022 * Math.min(A.w, A.h);
  const poly = [];
  for (let k = 0; k < 24; k++) { const a = k / 24 * Math.PI * 2; poly.push([nx + Math.cos(a) * R / A.w, ny + Math.sin(a) * R / A.h]); }
  return { poly, cx: nx, cy: ny, r: R / A.w };
}

function holdAt(nx, ny) {
  const x = Math.round(nx * A.w), y = Math.round(ny * A.h);
  const ref = colorAt(x, y);
  const reg = ref[1] < 6 && ref[2] > 40 ? null : grow(x, y, ref); // совсем серая стена — ставим кружок
  return { hold: reg ? hull(reg) : circleHold(nx, ny), ref: reg ? ref : null };
}

function findSimilar() {
  const n = A.w * A.h, ref = refColor;
  let m = new Uint8Array(n);
  for (let i = 0; i < n; i++) {
    if (ref[1] >= ACH && A.S[i] < ACH * 0.7) continue;
    if (dist(A.H[i], A.S[i], A.V[i], ref) < TOL) m[i] = 1;
  }
  // убираем шум: эрозия + дилатация 3×3
  const morph = (src, keepIf) => {
    const o = new Uint8Array(n);
    for (let y = 1; y < A.h - 1; y++) for (let x = 1; x < A.w - 1; x++) {
      let c = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) c += src[(y + dy) * A.w + x + dx];
      o[y * A.w + x] = keepIf(c) ? 1 : 0;
    }
    return o;
  };
  m = morph(morph(m, (c) => c === 9), (c) => c > 0);
  const lab = new Int32Array(n), minA = n * 0.00015, maxA = n * (ref[1] < ACH ? 0.015 : 0.03);
  const found = [];
  for (let s = 0; s < n; s++) {
    if (!m[s] || lab[s]) continue;
    const st = [s], comp = []; lab[s] = 1;
    while (st.length) {
      const i = st.pop(); comp.push(i);
      const x = i % A.w, y = (i / A.w) | 0;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const X = x + dx, Y = y + dy;
        if (X < 0 || Y < 0 || X >= A.w || Y >= A.h) continue;
        const j = Y * A.w + X;
        if (m[j] && !lab[j]) { lab[j] = 1; st.push(j); }
      }
    }
    if (comp.length >= minA && comp.length <= maxA) found.push(hull(comp));
  }
  return found.filter((f) => hit(f.cx, f.cy) < 0);
}

function hit(nx, ny) {
  // самая маленькая зацепка под пальцем (с небольшим запасом)
  let best = -1, br = Infinity;
  const ar = A.w / A.h;
  holds.forEach((hd, k) => {
    let inside = false;
    const p = hd.poly;
    for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
      if ((p[i][1] > ny) !== (p[j][1] > ny) && nx < (p[j][0] - p[i][0]) * (ny - p[i][1]) / (p[j][1] - p[i][1]) + p[i][0]) inside = !inside;
    }
    if (!inside) inside = Math.hypot(nx - hd.cx, (ny - hd.cy) / ar) < Math.max(hd.r * 1.15, 0.012);
    if (inside && hd.r < br) { br = hd.r; best = k; }
  });
  return best;
}

/* ================= Разметка: тапы ================= */
const snap = () => { history.push(JSON.stringify(holds)); if (history.length > 40) history.shift(); };

function resetRoute(full) {
  holds = []; history = []; refColor = null; tool = 'hold';
  if (full) { meta.grade = ''; meta.color = null; meta.title = ''; }
  else { meta.grade = ''; meta.color = null; }
  syncTools(); refresh();
}

function onTap(clientX, clientY) {
  const r = $('view').getBoundingClientRect();
  const nx = (clientX - r.left) / r.width, ny = (clientY - r.top) / r.height;
  if (nx < 0 || ny < 0 || nx > 1 || ny > 1) return;
  const k = hit(nx, ny);
  snap(); haptic();
  if (tool === 'hold') {
    if (k >= 0) holds.splice(k, 1);
    else {
      const { hold, ref } = holdAt(nx, ny);
      holds.push({ ...hold, type: 'hold' });
      if (ref && !refColor) refColor = ref;
    }
  } else {
    if (k >= 0) {
      const was = holds[k].type;
      holds.forEach((h) => { if (h.type === tool && tool === 'top') h.type = 'hold'; });
      holds[k].type = was === tool ? 'hold' : tool;
    } else {
      const { hold, ref } = holdAt(nx, ny);
      if (tool === 'top') holds.forEach((h) => { if (h.type === 'top') h.type = 'hold'; });
      holds.push({ ...hold, type: tool });
      if (ref && !refColor) refColor = ref;
    }
  }
  refresh();
}

/* ================= Зум пальцами ================= */
const V = { s: 1, tx: 0, ty: 0, bw: 0, bh: 0 }; // масштаб, сдвиг, базовый размер фото на экране
const pts = new Map();
let g = null; // текущий жест

function applyView(redraw) {
  const st = $('stage');
  const W = V.bw * V.s, H = V.bh * V.s;
  // фото не уезжает за край: если меньше экрана — по центру
  V.tx = W <= st.clientWidth ? (st.clientWidth - W) / 2 : Math.min(0, Math.max(st.clientWidth - W, V.tx));
  V.ty = H <= st.clientHeight ? (st.clientHeight - H) / 2 : Math.min(0, Math.max(st.clientHeight - H, V.ty));
  $('inner').style.transform = `translate(${V.tx}px, ${V.ty}px) scale(${V.s})`;
  if (redraw) refresh();
}

const stage = $('stage');
const local = (e) => { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
stage.addEventListener('pointerdown', (e) => {
  stage.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, local(e));
  if (pts.size === 1) g = { tap: true, x0: e.clientX, y0: e.clientY, last: local(e) };
  if (pts.size === 2) {
    const [a, b] = [...pts.values()];
    g = { tap: false, d0: Math.hypot(a.x - b.x, a.y - b.y), m0: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, s0: V.s, tx0: V.tx, ty0: V.ty, pinch: true };
  }
});
stage.addEventListener('pointermove', (e) => {
  if (!pts.has(e.pointerId) || !g) return;
  pts.set(e.pointerId, local(e));
  if (pts.size >= 2 && g.pinch) {
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    const ns = Math.min(6, Math.max(1, g.s0 * d / g.d0));
    const cx = (g.m0.x - g.tx0) / g.s0, cy = (g.m0.y - g.ty0) / g.s0; // точка фото под пальцами
    V.s = ns; V.tx = m.x - cx * ns; V.ty = m.y - cy * ns;
    applyView(false);
  } else if (pts.size === 1) {
    if (Math.hypot(e.clientX - g.x0, e.clientY - g.y0) > 8) g.tap = false;
    const p = local(e);
    if (!g.tap && V.s > 1) { V.tx += p.x - g.last.x; V.ty += p.y - g.last.y; applyView(false); }
    g.last = p;
  }
});
function endPointer(e) {
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);
  if (pts.size === 1 && g) { g.pinch = false; g.tap = false; g.last = [...pts.values()][0]; }
  if (pts.size === 0 && g) {
    if (g.tap && e.type === 'pointerup') onTap(e.clientX, e.clientY);
    else refresh(); // перерисовать тонкими линиями под новый масштаб
    g = null;
  }
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);
stage.addEventListener('dblclick', () => { V.s = 1; applyView(true); });
// колесо мыши / трекпад на компьютере
stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  const p = local(e), ns = Math.min(6, Math.max(1, V.s * Math.exp(-e.deltaY * 0.002)));
  V.tx = p.x - (p.x - V.tx) * ns / V.s; V.ty = p.y - (p.y - V.ty) * ns / V.s; V.s = ns;
  applyView(true);
}, { passive: false });

$('undo').onclick = () => { if (!history.length) return; holds = JSON.parse(history.pop()); if (!holds.length) refColor = null; refresh(); };

$('similar').onclick = () => {
  if (!refColor) return;
  $('busy').classList.add('on');
  setTimeout(() => {
    const f = findSimilar();
    $('busy').classList.remove('on');
    if (!f.length) return toast('Похожих не нашлось — отметьте вручную');
    snap();
    holds.push(...f.map((h) => ({ ...h, type: 'hold' })));
    haptic('ok'); refresh();
    toast(`+${f.length} — лишние уберите тапом`);
  }, 30);
};

document.querySelectorAll('.tool').forEach((b) => { b.onclick = () => { tool = b.dataset.t; syncTools(); }; });
function syncTools() {
  document.querySelectorAll('.tool').forEach((b) => b.classList.toggle('on', b.dataset.t === tool));
  $('hint').textContent = {
    hold: 'Тап — зацепка, ещё тап — убрать. Два пальца — зум',
    start: 'Тапните по стартовым зацепкам',
    top: 'Тапните по финишной зацепке',
  }[tool];
}

let closeArm = 0;
$('close').onclick = () => {
  if (holds.length && Date.now() - closeArm > 2500) { closeArm = Date.now(); return toast('Нажмите ещё раз, чтобы сбросить'); }
  closeArm = 0; show('s-start');
};
window.addEventListener('resize', () => { if ($('s-edit').classList.contains('on')) layout(); });

function layout() {
  const st = $('stage'), inner = $('inner'), cv = $('view');
  const fit = Math.min(st.clientWidth / img.naturalWidth, st.clientHeight / img.naturalHeight);
  V.bw = img.naturalWidth * fit; V.bh = img.naturalHeight * fit;
  inner.style.width = V.bw + 'px'; inner.style.height = V.bh + 'px';
  // холст с запасом по разрешению, чтобы при зуме оставалось чётко
  const k = Math.min(4096 / Math.max(V.bw, V.bh), (window.devicePixelRatio || 1) * 3);
  cv.width = Math.round(V.bw * k); cv.height = Math.round(V.bh * k);
  V.s = 1; applyView(false);
  refresh();
}

function refresh() {
  $('count').textContent = holds.length ? `${holds.length} ${plural(holds.length)}` : '';
  $('undo').disabled = !history.length;
  $('similar').disabled = !refColor;
  $('next').disabled = !holds.length;
  if (img && $('s-edit').classList.contains('on')) { const cv = $('view'); draw(cv.getContext('2d'), cv.width, cv.height, false); }
}
const plural = (n) => (n % 10 === 1 && n % 100 !== 11 ? 'зацепка' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 'зацепки' : 'зацепок');

/* ================= Рисование ================= */
function path(ctx, hd, W, H) {
  ctx.beginPath();
  hd.poly.forEach(([x, y], i) => (i ? ctx.lineTo(x * W, y * H) : ctx.moveTo(x * W, y * H)));
  ctx.closePath();
}

function draw(ctx, W, H, final) {
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(img, 0, 0, W, H);
  if (!holds.length) return;
  const u = Math.max(W, H) / 1000 / (final ? 1 : V.s); // единица толщины (тоньше при зуме)

  // затемняем всё, кроме зацепок трассы
  const o = document.createElement('canvas'); o.width = W; o.height = H;
  const oc = o.getContext('2d');
  oc.fillStyle = `rgba(0,0,0,${final ? 0.62 : 0.5})`; oc.fillRect(0, 0, W, H);
  oc.globalCompositeOperation = 'destination-out';
  oc.lineJoin = 'round';
  for (const hd of holds) { path(oc, hd, W, H); oc.fill(); oc.lineWidth = u * 6; oc.stroke(); }
  ctx.drawImage(o, 0, 0);

  ctx.lineJoin = 'round';
  for (const hd of holds) {
    const c = hd.type === 'start' ? '#22c55e' : hd.type === 'top' ? '#facc15' : '#ffffff';
    path(ctx, hd, W, H);
    ctx.lineWidth = u * 6.5; ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.stroke();
    ctx.lineWidth = u * 3.6; ctx.strokeStyle = c; ctx.stroke();
  }
  // подписи СТАРТ / ТОП
  const fs = Math.max(W, H) * 0.019 / (final ? 1 : Math.sqrt(V.s));
  ctx.font = `800 ${fs}px Manrope, system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const hd of holds) {
    if (hd.type === 'hold') continue;
    const t = hd.type === 'start' ? 'СТАРТ' : 'ТОП';
    let top = Infinity; for (const [, y] of hd.poly) top = Math.min(top, y);
    const tw = ctx.measureText(t).width + fs * 0.9, th = fs * 1.5;
    let x = hd.cx * W, y = top * H - th * 0.75;
    if (y - th / 2 < 4) { let b = 0; for (const [, yy] of hd.poly) b = Math.max(b, yy); y = b * H + th * 0.75; }
    x = Math.min(Math.max(x, tw / 2 + 4), W - tw / 2 - 4);
    ctx.fillStyle = hd.type === 'start' ? '#22c55e' : '#facc15';
    roundRect(ctx, x - tw / 2, y - th / 2, tw, th, th * 0.3); ctx.fill();
    ctx.fillStyle = '#111'; ctx.fillText(t, x, y + fs * 0.05);
  }
}
function roundRect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

/* ================= Параметры трассы ================= */
$('next').onclick = () => {
  if (!meta.color && refColor) meta.color = nearestColor(refColor);
  buildSheet();
  $('sheet-bg').classList.add('on');
};
$('sheet-bg').onclick = (e) => { if (e.target.id === 'sheet-bg') $('sheet-bg').classList.remove('on'); };

function buildSheet() {
  $('grades').innerHTML = '';
  for (const g of CONFIG.grades) {
    const b = document.createElement('button');
    b.className = 'grade' + (meta.grade === g ? ' on' : ''); b.textContent = g;
    b.onclick = () => { meta.grade = g; haptic(); buildSheet(); };
    $('grades').append(b);
  }
  $('colors').innerHTML = '';
  for (const c of CONFIG.colors) {
    const b = document.createElement('button');
    b.className = 'sw' + (meta.color && meta.color[0] === c[0] ? ' on' : ''); b.style.background = c[1]; b.title = c[0];
    b.setAttribute('aria-label', c[0]);
    b.onclick = () => { meta.color = c; haptic(); buildSheet(); };
    $('colors').append(b);
  }
  $('title').value = meta.title;
  $('make').disabled = !meta.grade || !meta.color;
}
$('title').oninput = (e) => { meta.title = e.target.value; };

/* ================= Итоговая картинка ================= */
let outBlob = null;
$('make').onclick = async () => {
  $('sheet-bg').classList.remove('on');
  try { await document.fonts.load('800 40px Manrope'); } catch (e) {}
  const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
  const W = Math.round(img.naturalWidth * k), H = Math.round(img.naturalHeight * k);
  const band = Math.round(Math.max(W * 0.16, 150));
  const c = document.createElement('canvas'); c.width = W; c.height = H + band;
  const ctx = c.getContext('2d');
  draw(ctx, W, H, true);

  // плашка снизу
  ctx.fillStyle = '#111'; ctx.fillRect(0, H, W, band);
  const pad = band * 0.2, tagH = band * 0.6, cy = H + band / 2;
  ctx.font = `800 ${tagH * 0.58}px Manrope, system-ui, sans-serif`;
  const tagW = Math.max(tagH * 1.35, ctx.measureText(meta.grade).width + tagH * 0.6);
  ctx.fillStyle = meta.color[1];
  roundRect(ctx, pad, cy - tagH / 2, tagW, tagH, tagH * 0.22); ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.stroke();
  ctx.fillStyle = light(meta.color[1]) ? '#111' : '#fff';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(meta.grade, pad + tagW / 2, cy + tagH * 0.03);

  const tx = pad * 2 + tagW;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#fff';
  ctx.font = `800 ${band * 0.22}px Manrope, system-ui, sans-serif`;
  ctx.fillText(fit(ctx, meta.title.trim() || meta.color[0] + ' трасса', W - tx - pad), tx, cy - band * 0.12);
  ctx.fillStyle = 'rgba(255,255,255,.6)';
  ctx.font = `700 ${band * 0.15}px Manrope, system-ui, sans-serif`;
  const d = new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
  const sub = [meta.title.trim() ? meta.color[0] : '', d, CONFIG.gym].filter(Boolean).join(' · ');
  ctx.fillText(fit(ctx, sub, W - tx - pad), tx, cy + band * 0.17);

  outBlob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.9));
  $('out').src = URL.createObjectURL(outBlob);
  $('send').textContent = inTg && CONFIG.api ? 'Отправить в чат' : 'Отправить';
  show('s-done'); haptic('ok');
};
function light(h) { const n = parseInt(h.slice(1), 16); return ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000 > 160; }
function fit(ctx, t, max) { if (ctx.measureText(t).width <= max) return t; while (t.length > 1 && ctx.measureText(t + '…').width > max) t = t.slice(0, -1); return t + '…'; }

/* ================= Отправка ================= */
const caption = () => [meta.grade, meta.title.trim() || meta.color[0]].join(' · ');
$('send').onclick = async () => {
  const btn = $('send');
  // 1) Telegram: бот присылает фото и открывает выбор чата
  if (inTg && CONFIG.api) {
    btn.disabled = true;
    try {
      const b64 = await new Promise((res) => { const f = new FileReader(); f.onload = () => res(f.result.split(',')[1]); f.readAsDataURL(outBlob); });
      const endpoint = CONFIG.api;
      const r = await fetch(endpoint, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initData: tg.initData, caption: caption(), photo: b64 }),
      });
      const j = await r.json();
      if (!r.ok || !j.ok) throw new Error(j.error || 'ошибка');
      if (j.id && tg.shareMessage) tg.shareMessage(j.id, (sent) => { if (sent) toast('Отправлено'); });
      else toast('Фото у вас в чате с ботом — перешлите его');
    } catch (e) { toast('Не отправилось: ' + e.message); }
    btn.disabled = false;
    return;
  }
  // 2) Системное «Поделиться» (телефон)
  const file = new File([outBlob], `трасса-${meta.grade}.jpg`, { type: 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  openViewer();
};

function openViewer() {
  $('viewer-img').src = $('out').src;
  $('viewer').classList.add('on');
}
$('viewer').onclick = (e) => { if (e.target.id !== 'viewer-img') $('viewer').classList.remove('on'); };

$('again').onclick = () => { resetRoute(false); show('s-edit'); layout(); };
</script>
</body>
